[project]
name = "cumulus"
version = "0.1.0"
description = "Cumulus — a culturally- and personally-responsive cloud-architecture mentor bot. Grounded RAG over a real cloud certification curriculum."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "anthropic>=0.40.0",
    "mcp>=1.2.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "eval: retrieval/answer quality eval; makes API + DB calls, excluded from the pre-commit hook (run with `python -m tests.eval`)",
]
