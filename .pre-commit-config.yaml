# Fast, deterministic checks that run on every `git commit`.
# Keep these QUICK — the eval harness (which makes API calls) runs separately,
# not here. Activate once with:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (offline unit tests)
        entry: uv run pytest -q -m "not eval"
        language: system
        pass_filenames: false
        always_run: true
